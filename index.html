<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Tombola Live</title>
  <style>
    body { font-family: Arial; text-align: center; }
    .hidden { display: none; }
    button { margin: 5px; padding: 10px 15px; font-size: 16px; }
    .won { background: #ccc; text-decoration: line-through; }
  </style>
</head>
<body>

<div id="roleSelect">
  <h1>Seleziona ruolo</h1>
  <button onclick="setRole('caller')">🎤 Chiamante</button>
  <button onclick="setRole('tv')">📺 TV</button>
</div>

<!-- CHIAMANTE -->
<div id="caller" class="hidden">
  <h2>Chiamante</h2>
  <button onclick="startGame()">▶ Avvia partita</button>
  <button onclick="resetGame()">🔄 Reset</button>

  <h3>Premi</h3>
  <div id="prizes"></div>

  <h3>Giocatori</h3>
  <div id="players"></div>
</div>

<!-- TV -->
<div id="tv" class="hidden">
  <h1>Tombola</h1>
  <h2>Giocatori</h2>
  <div id="tvPlayers"></div>

  <h2>Premi</h2>
  <div id="tvPrizes"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
