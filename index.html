<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Super Tombola</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .hidden { display: none; }

    button {
      padding: 10px 16px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
    }

    .premio {
      padding: 10px;
      border: 1px solid #555;
      margin: 5px;
      cursor: pointer;
    }

    .premio.vinto {
      background: #444;
      text-decoration: line-through;
      color: #999;
      cursor: not-allowed;
    }

    .giocatore {
      border: 1px solid #555;
      padding: 10px;
      margin: 5px;
    }

    .tv {
      text-align: center;
      padding: 40px;
    }

    .tv h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .tv h2 {
      font-size: 40px;
      color: gold;
    }
  </style>
</head>

<body>

<!-- SCELTA RUOLO -->
<div id="schermata-ruolo">
  <h1>Super Tombola</h1>
  <button onclick="setRuolo('chiamante')">Chiamante</button>
  <button onclick="setRuolo('tv')">TV</button>
</div>

<!-- CHIAMANTE -->
<div id="schermata-chiamante" class="hidden">
  <h2>Chiamante</h2>

  <button onclick="avviaPartita()">Avvia partita</button>
  <button onclick="resetPartita()">Reset</button>

  <h3>Premi</h3>
  <div id="lista-premi"></div>

  <h3>Giocatori</h3>
  <div id="lista-giocatori"></div>
</div>

<!-- TV -->
<div id="schermata-tv" class="hidden tv">
  <h1 id="tv-premio">IN ATTESA</h1>
  <h2 id="tv-vincitore"></h2>
  <div id="tv-giocatori"></div>
</div>

<script src="app.js"></script>
</body>
</html>
