<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Super Tombola</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎱 Super Tombola</h1>

<div id="roleSelect">
  <button onclick="setRole('caller')">🎤 Chiamante</button>
  <button onclick="setRole('tv')">📺 TV</button>
</div>

<div id="caller" class="hidden">
  <button onclick="startGame()">▶️ Avvia partita</button>
  <button onclick="resetGame()">🔄 Reset</button>

  <h3>Premi</h3>
  <div id="prizes"></div>

  <h3>Giocatori</h3>
  <div id="players"></div>
</div>

<div id="tv" class="hidden">
  <h2>📺 Stato partita</h2>
  <div id="tvPlayers"></div>
  <div id="tvPrizes"></div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import {
    getDatabase, ref, set, update, onValue
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCtuepB5Zrdqo1fN37P9Aivww0Cqc5950M",
    authDomain: "super-tombola.firebaseapp.com",
    databaseURL: "https://super-tombola-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "super-tombola",
    storageBucket: "super-tombola.appspot.com",
    messagingSenderId: "435954736235",
    appId: "1:435954736235:web:888090e32d4a663ae9e52e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.db = db;
  window.ref = ref;
  window.set = set;
  window.update = update;
  window.onValue = onValue;
</script>

<script src="app.js"></script>
</body>
</html>
